name: Feature request
description: Suggest a change or addition
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Rumpel is deliberately minimal. Playlists, a media library, a subtitle UI,
        streaming URLs, and a settings dialog are out of scope — proposals in those
        areas are likely to be declined.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you run into, not only the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should Rumpel do? Which control or shortcut would it use?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
